name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bundle universal app
        env:
          UNIVERSAL: "1"
        run: |
          VERSION="${GITHUB_REF_NAME#v}" ./scripts/bundle.sh
      - name: Zip
        run: ditto -c -k --keepParent build/RIM.app RIM.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" RIM.zip --generate-notes
